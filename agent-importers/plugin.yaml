name: agent-importers
label: Agent Importers
kind: standalone
version: 1.2.0
author: NousResearch
homepage: https://github.com/NousResearch/hermes-official-plugins/tree/main/agent-importers
description: >
  `hermes import-agent`: import an OpenClaw (~/.openclaw), Claude Code (~/.claude), Codex CLI
  (~/.codex), Cursor (~/.cursor) or Grok Bot setup into Hermes in one command. Grok Bot routines
  become cron jobs (created paused), its skills and memories come along, from an export the Bot
  writes itself. Instructions, Cursor rules
  and memories become memory entries, Bash permission rules
  become command allow/deny lists, MCP servers land in config.yaml, and skills are copied.
  Always previews first; API keys and credentials are never imported, except OpenClaw's
  allowlisted secrets when you pass --migrate-secrets. `hermes import-agent openclaw` takes a
  restore-point backup first; the old `hermes claw migrate` / `hermes claw cleanup` spelling
  keeps working, and the openclaw-migration skill ships along. `--sync` re-imports sources that
  changed. Formerly built into Hermes core.
requires_hermes: ">=0.21.6"
provides_tools: []
provides_hooks: []
